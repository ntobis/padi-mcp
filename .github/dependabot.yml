version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      types:
        patterns:
          - "@types/*"
      dev-deps:
        patterns:
          - "vitest"
          - "@biomejs/*"
          - "tsx"
          - "typescript"
          - "drizzle-kit"
      next:
        patterns:
          - "next"
          - "react"
          - "react-dom"
          - "@types/react*"
      workos:
        patterns:
          - "@workos-inc/*"
    labels:
      - dependencies
    commit-message:
      prefix: chore(deps)

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: chore(ci)
